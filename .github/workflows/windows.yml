name: Crear juego para Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm test
      - run: npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: Delfi-Cafe-Windows
          path: dist/Delfi-Cafe-win32-x64/
          retention-days: 14
